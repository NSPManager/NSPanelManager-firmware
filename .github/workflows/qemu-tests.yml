name: QEMU firmware tests

# Boots the real firmware in Espressif's QEMU fork against a fake manager,
# broker and Nextion display, and drives it with simulated screen input.
# See firmware_espidf/qemu/README.md.

on:
  push:
    paths:
      - "firmware_espidf/**"
      - ".github/workflows/qemu-tests.yml"
  pull_request:
    paths:
      - "firmware_espidf/**"
      - ".github/workflows/qemu-tests.yml"
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: firmware_espidf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.11 only for gdb's Python scripting (the failure dump); the tests run on 3.12.
          python-version: |
            3.11
            3.12

      - name: Install QEMU runtime libraries and mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0 zlib1g mosquitto
          # Each test starts its own broker on a random port; the system service is not used.
          sudo systemctl disable --now mosquitto

      - name: Cache the HMI and the .proto files
        uses: actions/cache@v6
        with:
          path: |
            firmware_espidf/qemu/build/hmi
            firmware_espidf/qemu/build/proto
          key: nspm-upstream-${{ hashFiles('firmware_espidf/qemu/nspanelmanager.ref') }}

      - name: Cache PlatformIO toolchains and QEMU
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/nspm-qemu
          key: qemu-tests-${{ runner.os }}-${{ hashFiles('firmware_espidf/platformio.ini', 'firmware_espidf/qemu/install_qemu.sh', '.github/workflows/qemu-tests.yml') }}

      - name: Install PlatformIO
        run: |
          pip install platformio==6.1.19
          # gdb, for the CPU and task dump a failing test takes of a hung guest.
          pio pkg install --global --tool "espressif/tool-xtensa-esp-elf-gdb@~12.1.0"

      - name: Build and test
        env:
          NSPM_QEMU_GDB: "1"
        run: qemu/run_tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-test-logs
          path: |
            firmware_espidf/qemu/build/junit.xml
            firmware_espidf/qemu/build/test-logs/
          if-no-files-found: ignore
